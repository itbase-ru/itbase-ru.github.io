<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переход к статье — IT·База</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://itbase-ru.github.io/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/data/index.js"></script>
  <script>
    /* Старые ссылки вида article.html?a=... ведут на новые адреса статей */
    (function(){
      var slug = new URLSearchParams(location.search).get('a');
      var found = null;
      for (var i = 0; i < ARTICLES.length; i++) {
        if (ARTICLES[i].slug === slug) { found = ARTICLES[i]; break; }
      }
      location.replace(found ? '/' + found.url : '/');
    })();
  </script>
</head>
<body>
  <p>Переходим к статье… Если ничего не произошло, <a href="/">откройте главную страницу</a>.</p>
</body>
</html>
