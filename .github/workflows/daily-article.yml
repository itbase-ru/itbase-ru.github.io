name: Daily Article

on:
  schedule:
    # 09:00 UTC = 12:00 Europe/Moscow (MSK = UTC+3)
    - cron: "0 9 * * *"
  workflow_dispatch:  # можно запустить вручную из вкладки Actions

permissions:
  contents: write    # пушить в репо
  models: read       # GitHub Models API (для LLM-генерации)

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate new article
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Europe/Moscow
        run: |
          python scripts/generate_article.py
        continue-on-error: true

      - name: Show generation result
        if: steps.gen.outcome != 'success'
        run: |
          echo "::warning::Генерация не удалась — собираем сайт с тем, что есть"
          exit 0

      - name: Build site
        run: |
          python build.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нет изменений — пропускаем коммит"
          else
            git commit -m "daily: auto-generated article $(date -u +%Y-%m-%d)"
            git push
          fi
