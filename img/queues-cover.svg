</g>
<text x="60" y="120" fill="#e9eef5" font-family="Georgia, serif" font-size="64" font-weight="700">Message Queues</text>
<text x="60" y="160" fill="#f0883e" font-family="monospace" font-size="18" letter-spacing="4">// RabbitMQ vs Kafka vs Redis</text>
<text x="60" y="620" fill="#8a95a6" font-family="monospace" font-size="22">pub / sub / queue / stream</text>
