<rect x="380" y="360" width="220" height="80" rx="10" fill="#12161d" stroke="#8f52ff" stroke-width="2"/>
<text x="430" y="410" fill="#8f52ff" font-size="20">Stream</text>

<rect x="720" y="360" width="220" height="80" rx="10" fill="#12161d" stroke="#2ea043" stroke-width="2"/>
<text x="775" y="410" fill="#2ea043" font-size="20">Worker</text>
</g>
<g stroke="#f778ba" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none">
<line x1="260" y1="260" x2="380" y2="260"/>
<polygon points="370,252 380,260 370,268" fill="#f778ba"/>
</g>
<g stroke="#f0883e" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none">
<line x1="600" y1="260" x2="720" y2="260"/>
<polygon points="710,252 720,260 710,268" fill="#f0883e"/>
</g>
<g stroke="#4f8cff" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="6 6" fill="none">
<line x1="830" y1="300" x2="830" y2="360"/>
</g>
<g stroke="#f0883e" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="6 6" fill="none">
