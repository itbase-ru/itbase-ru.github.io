<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a130a"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f0883e" stop-opacity="0.3"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="600" cy="340" r="280" fill="url(#glow)"/>
<g font-family="monospace">
<rect x="80" y="220" width="180" height="80" rx="10" fill="#12161d" stroke="#f778ba" stroke-width="2"/>
<text x="110" y="270" fill="#f778ba" font-size="20">Producer</text>

<rect x="380" y="220" width="220" height="80" rx="10" fill="#12161d" stroke="#f0883e" stroke-width="2"/>
<text x="430" y="270" fill="#f0883e" font-size="20">Queue</text>

<rect x="720" y="220" width="220" height="80" rx="10" fill="#12161d" stroke="#4f8cff" stroke-width="2"/>
