<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<defs>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0c0d12"/><stop offset="1" stop-color="#1a1d28"/>
</linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#rg)"/>
<line x1="600" y1="120" x2="600" y2="560" stroke="#3a4358" stroke-width="2" stroke-dasharray="8 8"/>
<g opacity="0.95">
<rect x="120" y="220" width="380" height="280" rx="24" fill="#2a1b0e" stroke="#ff7043" stroke-width="3"/>
<text x="310" y="320" text-anchor="middle" fill="#ff7043" font-family="Georgia, serif" font-size="100" font-weight="700">Rust</text>
<text x="310" y="370" text-anchor="middle" fill="#8a95a6" font-family="monospace" font-size="20">fn main() {</text>
<text x="310" y="400" text-anchor="middle" fill="#ffb454" font-family="monospace" font-size="20">  println!("Hi");</text>
<text x="310" y="430" text-anchor="middle" fill="#8a95a6" font-family="monospace" font-size="20">}</text>
</g>
<g opacity="0.95">
<rect x="700" y="220" width="380" height="280" rx="24" fill="#0c2018" stroke="#00add8" stroke-width="3"/>
<text x="890" y="320" text-anchor="middle" fill="#00add8" font-family="Georgia, serif" font-size="100" font-weight="700">Go</text>
<text x="890" y="370" text-anchor="middle" fill="#8a95a6" font-family="monospace" font-size="20">func main() {</text>
<text x="890" y="400" text-anchor="middle" fill="#5effc4" font-family="monospace" font-size="20">  fmt.Println("Hi")</text>
<text x="890" y="430" text-anchor="middle" fill="#8a95a6" font-family="monospace" font-size="20">}</text>
</g>
<text x="60" y="120" fill="#e9eef5" font-family="Georgia, serif" font-size="68" font-weight="700">Rust vs Go</text>
<text x="60" y="170" fill="#ffb454" font-family="monospace" font-size="18" letter-spacing="3">// КАКОЙ ЯЗЫК УЧИТЬ В 2026</text>
</svg>
